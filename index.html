<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Faz os acentos aparecerem corretamente -->
    <meta charset="UTF-8">
    <!-- Faz a página se ajustar à largura do celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuito Cruzado · Cruzadinha de Arquitetura Computacional</title>
    <!-- Liga o arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== Topo: logo, nome do jogo e LEDs decorativos ===== -->
    <header class="topo">
        <!-- Desenho de um chip, feito só com CSS (aria-hidden: o leitor de tela ignora) -->
        <div class="chip-logo" aria-hidden="true"><span>01</span></div>

        <div class="titulos">
            <h1>Circuito Cruzado</h1>
            <p class="subtitulo">Cruzadinha de Arquitetura Computacional</p>
        </div>

        <!-- Três "LEDs" que piscam, só para enfeitar -->
        <div class="leds" aria-hidden="true">
            <span class="led"></span>
            <span class="led"></span>
            <span class="led"></span>
        </div>
    </header>

    <main id="jogo">
        <!-- Coluna da esquerda: botões, contador e tabuleiro -->
        <section class="coluna-tabuleiro">
            <!-- Botões do jogo e o contador de acertos -->
            <div id="controles">
                <button id="botao-conferir">Conferir</button>
                <button id="botao-reiniciar">Reiniciar</button>

                <div class="placar">
                    <p id="contador"></p>
                    <!-- Barra de progresso: o script.js muda a largura da parte preenchida -->
                    <div class="barra" aria-hidden="true">
                        <div id="barra-preenchida"></div>
                    </div>
                </div>
            </div>

            <!-- Mostra a pista da palavra que o jogador está preenchendo agora -->
            <p id="pista-atual">Clique numa casa ou numa pista para começar.</p>

            <!-- Fica vazia: o script.js cria as casas aqui dentro -->
            <div id="tabuleiro"></div>
        </section>

        <!-- Coluna da direita: as listas ficam vazias, o script.js coloca as pistas -->
        <section id="pistas">
            <div class="bloco-pistas">
                <h2>Horizontais</h2>
                <ul id="pistas-horizontais"></ul>
            </div>
            <div class="bloco-pistas">
                <h2>Verticais</h2>
                <ul id="pistas-verticais"></ul>
            </div>
        </section>
    </main>

    <!-- Tela de vitória: começa escondida (hidden) e aparece quando tudo estiver certo -->
    <div id="vitoria" hidden>
        <div class="cartao-vitoria">
            <div class="selo-vitoria" aria-hidden="true">✔</div>
            <h2>Sistema 100% operacional!</h2>
            <p>Você acertou todas as palavras da cruzadinha.</p>
            <button id="botao-fechar-vitoria">Continuar</button>
        </div>
    </div>

    <!-- O script vem por último para que os elementos acima já existam quando ele rodar -->
    <script src="script.js"></script>
</body>
</html>
