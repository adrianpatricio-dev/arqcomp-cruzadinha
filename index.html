<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Faz os acentos aparecerem corretamente -->
    <meta charset="UTF-8">
    <!-- Faz a página se ajustar à largura do celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzadinha de Arquitetura Computacional</title>
    <!-- Liga o arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cruzadinha de Arquitetura Computacional</h1>

    <!-- Botões do jogo e o contador de acertos -->
    <div id="controles">
        <button id="botao-conferir">Conferir</button>
        <p id="contador"></p>
    </div>

    <main id="jogo">
        <!-- Fica vazia: o script.js cria as casas aqui dentro -->
        <div id="tabuleiro"></div>

        <!-- As listas também ficam vazias: o script.js coloca as pistas -->
        <section id="pistas">
            <div>
                <h2>Horizontais</h2>
                <ul id="pistas-horizontais"></ul>
            </div>
            <div>
                <h2>Verticais</h2>
                <ul id="pistas-verticais"></ul>
            </div>
        </section>
    </main>

    <!-- O script vem por último para que a div acima já exista quando ele rodar -->
    <script src="script.js"></script>
</body>
</html>
